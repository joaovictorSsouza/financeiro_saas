name: financeiro

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: roda a imagem de PRODUÇÃO localmente (gunicorn + settings prod).
  # Suba com: make up-api  (ou docker compose --profile api up --build)
  # Redirect HTTPS e cookies "secure" ficam desligados aqui para funcionar em
  # http://localhost (inclusive o login do /admin/). Em produção ficam ligados.
  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-financeiro}:${POSTGRES_PASSWORD:-financeiro}@postgres:5432/${POSTGRES_DB:-financeiro}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      GUNICORN_WORKERS: "2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
