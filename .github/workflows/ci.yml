name: CI

on:
  push:
  pull_request:

# Em PRs e branches, um push novo cancela o CI anterior. Na main não, para não
# interromper um deploy no meio (o job de deploy tem a própria fila, abaixo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mesma versão maior do Supabase (POSTGRES_VERSION no docker-compose).
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financeiro
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-somente-para-testes
      DATABASE_URL: postgres://financeiro:financeiro@localhost:5432/financeiro
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verifica migrations pendentes
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem de produção
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t financeiro-api:ci .

  # CD: só depois de lint, testes e build verdes, e só em push na main.
  deploy:
    needs: [lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.HEALTHCHECK_URL }}
    # Um deploy por vez. Um push novo espera o atual terminar (não cancela).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Dispara o deploy no Easypanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Segredo EASYPANEL_DEPLOY_WEBHOOK não configurado."
            exit 1
          fi
          # --silent sem --show-error: nenhuma mensagem do curl (que poderia citar o host).
          status=0
          curl --fail --silent --output /dev/null \
            --request POST \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$WEBHOOK" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Falha ao chamar o webhook do Easypanel (curl saiu com $status)."
            exit 1
          fi
          echo "Deploy disparado para ${GITHUB_SHA}."

      - name: Espera a versão nova responder no health
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::Variável HEALTHCHECK_URL não configurada."
            exit 1
          fi
          limite=$(( $(date +%s) + 600 ))   # 10 minutos
          while [ "$(date +%s)" -lt "$limite" ]; do
            corpo=$(curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" || true)
            versao=$(printf '%s' "$corpo" | jq -r '.versao // empty' 2>/dev/null || true)
            status=$(printf '%s' "$corpo" | jq -r '.status // empty' 2>/dev/null || true)

            if [ "$status" = "ok" ] && [ "$versao" = "$GITHUB_SHA" ]; then
              echo "Versão ${GITHUB_SHA} no ar e saudável."
              exit 0
            fi

            # Se a main andou e o Easypanel já subiu um commit mais novo que contém este,
            # o deploy deste commit está coberto.
            if [ "$status" = "ok" ] && [ -n "$versao" ]; then
              relacao=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${versao}" \
                --jq .status 2>/dev/null || true)
              if [ "$relacao" = "ahead" ]; then
                echo "No ar: ${versao}, mais novo e contém ${GITHUB_SHA}. OK."
                exit 0
              fi
            fi

            echo "Aguardando... status=${status:-sem resposta} versao=${versao:-?}"
            sleep 15
          done
          echo "::error::A versão ${GITHUB_SHA} não apareceu no health em 10 minutos."
          exit 1
